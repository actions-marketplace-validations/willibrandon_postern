id = "postern"
name = "Postern"
description = "PostgreSQL configuration files: highlighting for postgresql.conf, pg_hba.conf and pg_ident.conf, and the Postern language server."
version = "0.1.6"
schema_version = 1
authors = ["Brandon Williams"]
repository = "https://github.com/willibrandon/postern"

[grammars.postgresql_conf]
repository = "https://github.com/willibrandon/tree-sitter-postgresql-conf"
rev = "main"

[language_servers.postern]
name = "Postern"
languages = ["PostgreSQL Config"]
