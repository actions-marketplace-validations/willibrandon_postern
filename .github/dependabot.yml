version: 2
updates:
  - package-ecosystem: mix
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: America/Los_Angeles
  - package-ecosystem: npm
    directory: /editors/vscode
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: America/Los_Angeles
    groups:
      npm-development:
        dependency-type: development
        update-types: [minor, patch]
      npm-runtime:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # Keep compile-time API types aligned with engines.vscode. Raise both
      # deliberately when the minimum supported VS Code version changes.
      - dependency-name: "@types/vscode"
      # Keep Node types aligned with the supported Node 24 toolchain.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 10
  - package-ecosystem: npm
    directory: /editors/fresh
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: America/Los_Angeles
    groups:
      npm-development:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Keep Node types aligned with the supported Node 24 toolchain.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: cargo
    directory: /editors/zed
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: America/Los_Angeles
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "10:30"
      timezone: America/Los_Angeles
    groups:
      github-actions:
        patterns: ["*"]
